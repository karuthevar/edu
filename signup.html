<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account</title><link rel="stylesheet" href="styles.css"></head><body><div class="progress-track"><div id="pageProgress"></div></div><nav><div class="nav"><a class="brand" href="index.html">🎓 Ontario Student Hub</a><div class="links"><a href="grades.html">Grades</a><a href="subjects.html">Subjects</a><a href="forum.html">Forum</a></div></div></nav><main class="auth-shell"><section class="auth-card"><h1>Create account</h1><p class="subtitle">Join with a public nickname. Do not use your full legal name or school name.</p><div id="formMessage" class="form-message"></div><form class="form-grid" data-auth-form="signup"><div class="form-row"><label for="display_name">Display name</label><input id="display_name" name="display_name" minlength="3" maxlength="30" autocomplete="nickname" required><span class="form-help">Letters, numbers, spaces, hyphens, and underscores only.</span></div><div class="form-row"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div><div class="form-row"><label for="password">Password</label><input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required><span class="form-help">Use at least 8 characters and a unique password.</span></div><label class="checkitem"><input type="checkbox" name="rules" required> I agree to the <a href="community-rules.html">community rules</a> and will not share personal information.</label><button class="button" type="submit">Create account</button></form><div class="auth-links"><a href="signin.html">Already have an account?</a><a href="community-rules.html">Community rules</a></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="auth.js"></script><script src="auth-pages.js"></script><script src="app.js"></script></body></html>
